name: PortWatch VI to Telegram

on:
  # Any change to the repository also runs a check, so edits test themselves.
  push:
    branches: [main]
  # Every 20 minutes. GitHub may start a scheduled run a few minutes late; the
  # site itself refreshes every 3 hours, so that is fine.
  schedule:
    - cron: "*/20 * * * *"
  # Lets you run it by hand from the Actions tab (useful for the first test).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portwatch-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read the feed and send new items
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python feedbot.py

      - name: Translation providers check
        run: |
          python - <<'PY'
          import feedbot
          text = "DexNom takes #1 at 78%: ray-traced lighting works at 3-5 fps."
          for name, fn in (("google", feedbot.translate_chunk),
                           ("backup", feedbot.translate_chunk_backup)):
              try:
                  print(f"{name}: {fn(text)}")
              except Exception as error:
                  print(f"{name}: FAILED {type(error).__name__}: {error}")
          PY

      - name: Remember what was already sent
        run: |
          git config user.name "portwatch-bot"
          git config user.email "portwatch-bot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "state: $(date -u +%FT%TZ)"
            git push
          fi
